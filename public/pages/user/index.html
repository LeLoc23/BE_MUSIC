<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE_MUSIC - Final Fixed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'main-bg': '#170f23', 'sidebar-bg': '#231b2e', 'player-bg': '#130c1c',
                        'primary': '#9b4de0', 'text-sec': '#dadada', 'hover-item': '#ffffff1a'
                    },
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
                    animation: { 'spin-slow': 'spin 3s linear infinite' }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #170f23; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9b4de0; }
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans antialiased text-text-sec bg-main-bg selection:bg-primary selection:text-white">

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-[240px] bg-sidebar-bg flex flex-col hidden md:flex border-r border-white/5 z-20">
            <div class="h-[70px] flex items-center px-6">
                <i class="fa-solid fa-record-vinyl text-3xl text-primary animate-spin-slow mr-3"></i>
                <span class="text-xl font-bold tracking-wider text-white">BE_<span class="text-primary">MUSIC</span></span>
            </div>

            <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto">
                <a href="#" onclick="switchTab('all')" id="tab-all" class="nav-item flex items-center px-4 py-3 bg-white/5 text-white rounded-md border-l-4 border-primary transition-all">
                    <i class="fa-solid fa-house mr-4 text-xl w-6 text-center"></i><span class="font-medium">Trang Chủ</span>
                </a>
                
                <div id="libraryMenu" class="hidden">
                    <div class="mt-6 px-4 text-xs font-bold text-gray-500 uppercase mb-2">Thư viện</div>
                    <a href="#" onclick="switchTab('likes')" id="tab-likes" class="nav-item flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-md transition">
                        <i class="fa-solid fa-heart mr-4 text-xl w-6 text-center"></i><span class="font-medium">Yêu thích</span>
                    </a>
                    <a href="#" onclick="switchTab('playlists')" id="tab-playlists" class="nav-item flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-md transition">
                        <i class="fa-solid fa-folder-open mr-4 text-xl w-6 text-center"></i><span class="font-medium">Playlist</span>
                    </a>
                    <a href="#" onclick="switchTab('history')" id="tab-history" class="nav-item flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-md transition">
                        <i class="fa-solid fa-clock-rotate-left mr-4 text-xl w-6 text-center"></i><span class="font-medium">Lịch sử</span>
                    </a>
                </div>

                <div id="managerMenu" class="hidden mt-6 border-t border-white/10 pt-4">
                    <p class="px-4 text-xs font-bold text-orange-500 uppercase mb-2">Quản Lý</p>
                    <a href="#" onclick="switchTab('stats')" id="tab-stats" class="nav-item flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-md transition">
                        <i class="fa-solid fa-chart-pie mr-4 text-xl w-6 text-center"></i><span class="font-medium">Thống Kê</span>
                    </a>
                </div>
                <div id="adminMenu" class="hidden mt-2">
                    <p class="px-4 text-xs font-bold text-red-500 uppercase mb-2">Admin Center</p>
                    <a href="#" onclick="switchTab('users')" id="tab-users" class="nav-item flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-md transition">
                        <i class="fa-solid fa-users-gear mr-4 text-xl w-6 text-center"></i><span class="font-medium">QL Users</span>
                    </a>
                </div>

                <div class="mt-6 border-t border-white/10 pt-4 px-2" id="authSection">
                    <div class="bg-white/5 p-4 rounded-lg">
                        <div class="flex gap-2 mb-3">
                            <button onclick="showAuth('login')" class="flex-1 py-1 text-xs font-bold bg-primary text-white rounded">Login</button>
                            <button onclick="showAuth('register')" class="flex-1 py-1 text-xs font-bold bg-gray-700 text-white rounded">Register</button>
                        </div>
                        <div id="loginForm">
                            <input type="text" id="loginUser" placeholder="Username" class="w-full bg-black/20 border border-white/10 rounded px-2 py-1 text-xs mb-2 text-white">
                            <input type="password" id="loginPass" placeholder="Password" class="w-full bg-black/20 border border-white/10 rounded px-2 py-1 text-xs mb-2 text-white" onkeydown="if(event.key === 'Enter') doLogin()">
                            <button onclick="doLogin()" class="w-full bg-white/10 hover:bg-white/20 text-white text-xs py-1 rounded">Đăng nhập</button>
                        </div>
                        <div id="regForm" class="hidden">
                            <input type="text" id="regUser" placeholder="New User" class="w-full bg-black/20 border border-white/10 rounded px-2 py-1 text-xs mb-2 text-white">
                            <input type="password" id="regPass" placeholder="New Pass" class="w-full bg-black/20 border border-white/10 rounded px-2 py-1 text-xs mb-2 text-white" onkeydown="if(event.key === 'Enter') doRegister()">
                            <button onclick="doRegister()" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs py-1 rounded">Đăng ký</button>
                        </div>
                        <p id="authMsg" class="text-red-500 text-[10px] mt-1 text-center"></p>
                    </div>
                </div>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col bg-main-bg relative overflow-y-auto scroll-smooth">
            <header class="sticky top-0 z-30 flex items-center justify-between px-8 py-4 bg-main-bg/90 backdrop-blur-md border-b border-white/5">
                <div class="flex items-center gap-4 w-1/2">
                    <div class="relative w-full max-w-lg group">
                        <span class="absolute left-4 top-3 text-gray-400 group-focus-within:text-primary transition"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" onkeypress="handleEnter(event)" class="w-full bg-sidebar-bg text-white pl-12 pr-4 py-2.5 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition border border-white/5" placeholder="Tìm kiếm...">
                        <button onclick="performSearch()" class="absolute right-2 top-1 bg-primary hover:bg-purple-600 text-white px-4 py-1.5 rounded-full text-xs font-bold transition">Tìm</button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="uploadBtn" onclick="toggleAdminModal()" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center transition hidden text-orange-500" title="Upload Nhạc"><i class="fa-solid fa-cloud-arrow-up"></i></button>
                    <div id="userDisplay" class="hidden flex items-center gap-3">
                        <div class="text-right hidden md:block">
                            <div id="userNameDisplay" class="text-sm font-bold text-white">User</div>
                            <div id="userRoleDisplay" class="text-[10px] text-gray-400 uppercase tracking-wider">Member</div>
                        </div>
                        <img src="https://ui-avatars.com/api/?name=User&background=random" class="w-10 h-10 rounded-full border-2 border-primary">
                        <button onclick="doLogout()" class="text-xs text-red-400 hover:text-red-500 ml-2"><i class="fa-solid fa-power-off"></i></button>
                    </div>
                </div>
            </header>

            <div class="px-8 pb-32 pt-6">
                <div class="flex justify-between items-center mb-5">
                    <h2 id="sectionTitle" class="text-xl font-bold text-white flex items-center gap-2">
                        <span id="pageName">Kho Nhạc</span> 
                        <button id="createPlBtn" onclick="createPlaylist()" class="hidden text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded ml-3 border border-white/10"><i class="fa-solid fa-plus mr-1"></i> Tạo Playlist</button>
                    </h2>
                    
                    <div class="flex gap-2">
                        <button class="tab-btn active bg-white/5 text-white border-l-4 border-primary px-3 py-1 rounded" id="btnAll" onclick="switchTab('all')">Kho Nhạc</button>
                        <button class="tab-btn text-gray-400 hover:text-white px-3 py-1 rounded hidden" id="btnLikes" onclick="switchTab('likes')">Yêu Thích</button>
                        <button class="tab-btn text-gray-400 hover:text-white px-3 py-1 rounded hidden" id="btnPl" onclick="switchTab('playlists')">Playlist</button>
                        <button class="tab-btn text-gray-400 hover:text-white px-3 py-1 rounded hidden" id="btnHistory" onclick="switchTab('history')">Lịch Sử</button>
                        
                        <button class="tab-btn text-gray-400 hover:text-white px-3 py-1 rounded hidden" id="btnUsers" onclick="switchTab('users')">Users</button>
                        <button class="tab-btn text-gray-400 hover:text-white px-3 py-1 rounded hidden" id="btnStats" onclick="switchTab('stats')">Thống Kê</button>
                    </div>
                </div>
                
                <div id="mainContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6">
                    <div class="col-span-full text-center py-20 text-gray-500">Vui lòng đăng nhập...</div>
                </div>

                <div id="searchSplitView" class="hidden flex flex-col lg:flex-row gap-6 h-[500px]">
                    <div class="flex-1 bg-sidebar-bg rounded-xl border border-white/5 flex flex-col overflow-hidden">
                        <div class="p-4 border-b border-white/5 bg-white/5 font-bold text-white flex justify-between">
                            <span><i class="fa-solid fa-database mr-2 text-blue-500"></i> Kết quả tìm trong Database</span>
                            <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded">Local</span>
                        </div>
                        <div id="sqlResults" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
                    </div>
                    <div class="flex-1 bg-sidebar-bg rounded-xl border border-primary/30 flex flex-col overflow-hidden relative">
                        <div class="p-4 border-b border-primary/20 bg-primary/10 font-bold text-white flex justify-between">
                            <span><i class="fa-solid fa-wand-magic-sparkles mr-2 text-primary"></i> Gợi ý AI</span>
                            <span class="text-xs bg-primary/20 text-primary px-2 py-0.5 rounded">Internet</span>
                        </div>
                        <div id="aiAnalysisMsg" class="px-4 py-2 text-xs text-primary italic border-b border-white/5 bg-black/20"></div>
                        <div id="aiResults" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer class="h-[90px] bg-player-bg border-t border-white/5 px-6 flex items-center justify-between fixed bottom-0 w-full z-50 shadow-2xl">
        <div class="flex items-center w-[30%] gap-4">
            <div class="w-14 h-14 rounded overflow-hidden bg-gray-800 shadow-lg group relative">
                <img id="currentCover" src="https://via.placeholder.com/64?text=Music" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col justify-center overflow-hidden">
                <h4 id="currentTitle" class="font-bold text-white text-sm truncate">Sẵn sàng</h4>
                <p id="currentArtist" class="text-xs text-gray-400 truncate">---</p>
            </div>
        </div>
        <div class="flex flex-col items-center w-[40%]">
            <div class="flex items-center gap-6 mb-1">
                <button class="text-white hover:text-primary transition text-xl"><i class="fa-solid fa-backward-step"></i></button>
                <button id="mainPlayBtn" onclick="togglePlay()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition shadow-lg shadow-primary/20">
                    <i class="fa-solid fa-play ml-1" id="playIcon"></i>
                </button>
                <button class="text-white hover:text-primary transition text-xl"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="w-full flex items-center gap-3 text-xs text-gray-400 font-medium">
                <span id="currentTime">00:00</span>
                <input type="range" id="progressBar" value="0" max="100" class="flex-1 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer hover:h-1.5 accent-primary">
                <span id="duration">00:00</span>
            </div>
        </div>
        <div class="flex items-center w-[30%] justify-end gap-4">
            <button onclick="document.getElementById('lyricsModal').classList.remove('hidden')" class="text-gray-400 hover:text-white" title="Xem lời bài hát"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <audio id="audioPlayer" hidden></audio>
    </footer>

    <div id="adminModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-sidebar-bg w-[500px] rounded-xl border border-white/10 p-6 shadow-2xl modal-enter">
            <h3 class="text-xl font-bold text-white mb-4">Upload Nhạc</h3>
            <div class="space-y-3">
                <input type="text" id="newTitle" placeholder="Tên bài hát" class="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                <input type="text" id="newArtist" placeholder="Ca sĩ" class="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="newGenre" placeholder="Thể loại" class="bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                    <input type="number" id="newYear" placeholder="Năm" class="bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <textarea id="newLyrics" rows="2" placeholder="Lời bài hát" class="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-white"></textarea>
                <div class="grid grid-cols-2 gap-3 text-xs text-gray-400">
                    <div><label>File MP3*</label><input type="file" id="newFile" accept="audio/*" class="w-full mt-1"></div>
                    <div><label>Ảnh Bìa</label><input type="file" id="newImage" accept="image/*" class="w-full mt-1"></div>
                    <div><label>Video</label><input type="file" id="newVideo" accept="video/*" class="w-full mt-1"></div>
                </div>
                <div class="flex gap-3 mt-4">
                    <button onclick="addSong()" class="flex-1 bg-primary text-white py-2 rounded font-bold">Upload</button>
                    <button onclick="toggleAdminModal()" class="flex-1 bg-gray-600 text-white py-2 rounded">Hủy</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editSongModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-sidebar-bg w-[500px] rounded-xl border border-white/10 p-6 shadow-2xl modal-enter">
            <h3 class="text-xl font-bold text-white mb-4">Chỉnh sửa Bài Hát</h3>
            <input type="hidden" id="editId">
            <div class="space-y-3">
                <input type="text" id="editTitle" placeholder="Tên bài hát" class="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                <input type="text" id="editArtist" placeholder="Ca sĩ" class="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="editGenre" placeholder="Thể loại" class="bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                    <input type="number" id="editYear" placeholder="Năm" class="bg-black/30 border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <textarea id="editLyrics" rows="4" placeholder="Lời bài hát" class="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-white"></textarea>
                <div class="flex gap-3 mt-4">
                    <button onclick="submitEditSong()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold">Lưu thay đổi</button>
                    <button onclick="document.getElementById('editSongModal').classList.add('hidden')" class="flex-1 bg-gray-600 text-white py-2 rounded">Hủy</button>
                </div>
            </div>
        </div>
    </div>

    <div id="lyricsModal" class="fixed inset-0 bg-black/90 hidden z-[70] flex items-center justify-center">
        <div class="max-w-2xl w-full h-[80vh] p-8 text-center relative flex flex-col">
            <button onclick="document.getElementById('lyricsModal').classList.add('hidden')" class="absolute top-0 right-0 text-white text-2xl p-4"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-bold text-white mb-6">Lời Bài Hát</h2>
            <div id="lyricsContent" class="text-lg text-gray-300 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <div id="playlistModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center">
        <div class="bg-sidebar-bg w-[400px] rounded-xl border border-white/10 p-6 modal-enter">
            <h3 class="text-xl font-bold text-white mb-4">Thêm vào Playlist</h3>
            <div id="modalPlaylistList" class="space-y-2 max-h-60 overflow-y-auto"></div>
            <button onclick="document.getElementById('playlistModal').classList.add('hidden')" class="w-full mt-4 bg-gray-600 text-white py-2 rounded">Đóng</button>
        </div>
    </div>

    <div id="videoModal" class="fixed inset-0 bg-black/95 hidden z-[80] flex items-center justify-center">
        <div class="relative w-full max-w-4xl">
            <button onclick="closeVideo()" class="absolute -top-10 right-0 text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
            <video id="videoPlayer" controls class="w-full rounded-xl shadow-2xl"></video>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";
        let currentUser = null;
        let likedSongIds = [];
        let selectedSongId = null;
        let allSongsCache = [];
        const audio = document.getElementById('audioPlayer');
        const progressBar = document.getElementById('progressBar');

        // --- AUTH ---
        function showAuth(type) {
            document.getElementById('loginForm').classList.toggle('hidden', type !== 'login');
            document.getElementById('regForm').classList.toggle('hidden', type !== 'register');
        }
        async function doLogin() {
            const u = document.getElementById('loginUser').value, p = document.getElementById('loginPass').value;
            try {
                const res = await fetch(`${API_URL}/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p}) });
                const json = await res.json();
                if(res.ok) { currentUser = json.user; updateUI(true); switchTab('all'); fetchAllSongsForAI(); } 
                else document.getElementById('authMsg').innerText = json.error;
            } catch(e) { document.getElementById('authMsg').innerText = "Lỗi kết nối server!"; }
        }
        function doLogout() { currentUser=null; updateUI(false); location.reload(); }
        function updateUI(isLogin) {
            document.getElementById('authSection').classList.toggle('hidden', isLogin);
            document.getElementById('userDisplay').classList.toggle('hidden', !isLogin);
            
            // Toggle Sidebar Menu
            document.getElementById('libraryMenu').classList.toggle('hidden', !isLogin);
            
            // Toggle Top Nav Buttons
            const tabs = ['btnLikes', 'btnPl', 'btnHistory'];
            tabs.forEach(id => document.getElementById(id).classList.toggle('hidden', !isLogin));

            if(isLogin) {
                document.getElementById('userNameDisplay').innerText = currentUser.username;
                document.getElementById('userRoleDisplay').innerText = currentUser.role;
                const isAdmin = currentUser.role === 'admin';
                const isManager = currentUser.role === 'manager';
                
                document.getElementById('managerMenu').classList.toggle('hidden', !(isAdmin || isManager));
                document.getElementById('uploadBtn').classList.toggle('hidden', !(isAdmin || isManager));
                document.getElementById('adminMenu').classList.toggle('hidden', !isAdmin);
                
                document.getElementById('btnUsers').classList.toggle('hidden', !isAdmin);
                document.getElementById('btnStats').classList.toggle('hidden', !(isAdmin || isManager));
            }
        }

        async function fetchAllSongsForAI() {
            try { const res = await fetch(`${API_URL}/songs`); const json = await res.json(); allSongsCache = json.data; } catch(e) {}
        }

        // --- NAVIGATION ---
        function switchTab(type) {
            if(type === 'users' && (!currentUser || currentUser.role !== 'admin')) return alert("Cấm truy cập!");
            if(type === 'stats' && (!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'manager'))) return alert("Cấm truy cập!");

            // Update Tab Style (Top Nav)
            document.querySelectorAll('.tab-btn').forEach(el => { 
                el.classList.remove('bg-white/5', 'text-white', 'border-l-4', 'border-primary'); 
                el.classList.add('text-gray-400'); 
            });
            const activeBtn = document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-white/5', 'text-white', 'border-l-4', 'border-primary');
                activeBtn.classList.remove('text-gray-400');
            }

            // Update Sidebar Link
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('bg-white/5', 'text-white', 'border-l-4', 'border-primary'));
            const sideTab = document.getElementById(`tab-${type}`);
            if(sideTab) sideTab.classList.add('bg-white/5', 'text-white', 'border-l-4', 'border-primary');

            
            document.getElementById('mainContainer').classList.remove('hidden');
            document.getElementById('searchSplitView').classList.add('hidden');
            document.getElementById('createPlBtn').classList.add('hidden');
            const container = document.getElementById('mainContainer');
            container.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';
            
            if(type === 'all') { 
                document.getElementById('pageName').innerText = "Kho Nhạc"; 
                container.className = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6";
                loadSongs(); 
            }
            else if(type === 'likes') { 
                document.getElementById('pageName').innerText = "Yêu Thích"; 
                container.className = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6";
                loadLikedSongs(); 
            }
            else if(type === 'playlists') { 
                document.getElementById('pageName').innerText = "Playlist"; 
                document.getElementById('createPlBtn').classList.remove('hidden'); 
                container.className = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"; 
                loadPlaylists(); 
            }
            else if(type === 'history') { 
                document.getElementById('pageName').innerText = "Lịch Sử"; 
                container.className = "flex flex-col gap-2";
                loadHistory(); 
            }
            else if(type === 'users') { 
                document.getElementById('pageName').innerText = "Quản Lý Users"; 
                container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"; 
                loadUsers(); 
            }
            else if(type === 'stats') { 
                document.getElementById('pageName').innerText = "Thống Kê"; 
                container.className = "block"; 
                loadStats(); 
            }
        }

        // --- FETCHING ---
        async function fetchLikedIds() { if(!currentUser) return; const res = await fetch(`${API_URL}/user/likes/ids`, { headers: {'X-User-ID': currentUser.id} }); likedSongIds = await res.json(); }
        async function loadSongs() { await fetchLikedIds(); const res = await fetch(`${API_URL}/songs`); const json = await res.json(); renderGrid(json.data, 'song'); }
        async function loadLikedSongs() { await fetchLikedIds(); const res = await fetch(`${API_URL}/user/likes`, { headers: { 'X-User-ID': currentUser.id } }); const json = await res.json(); renderGrid(json.data, 'song'); }
        async function loadPlaylists() { const res = await fetch(`${API_URL}/user/playlists`, {headers:{'X-User-ID':currentUser.id}}); const json = await res.json(); renderGrid(json.data, 'playlist'); }
        async function loadHistory() { 
            const res = await fetch(`${API_URL}/user/history`,{headers:{'X-User-ID':currentUser.id}}); 
            const json = await res.json(); 
            renderHistoryList(json.data);
        }

        // --- RENDER GRID (SONG/PLAYLIST) ---
        function renderGrid(data, type) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = "";
            if(!data || data.length === 0) return container.innerHTML = "<div class='col-span-full text-center text-gray-500'>Trống.</div>";

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-white/5 hover:bg-white/10 rounded-lg p-4 transition group cursor-pointer border border-transparent hover:border-white/10 relative";
                
                div.onclick = (e) => {
                    if (e.target.closest('button') || e.target.closest('i') && e.target.tagName !== 'DIV') return;
                    if(type === 'song') playSong(item.id, item.title, item.artist, item.stream_url, item.image_url, item.lyrics||'');
                    else if (type === 'playlist') viewPlaylist(item.id, item.name);
                };

                if(type === 'song') {
                    const isLiked = likedSongIds.includes(item.id);
                    const canManage = currentUser && (currentUser.role === 'admin' || currentUser.role === 'manager');
                    let adminActions = '';
                    if(canManage) {
                        const sData = JSON.stringify(item).replace(/"/g, '&quot;');
                        adminActions = `
                            <button onclick="openEditSong(event, ${sData})" class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded hover:bg-blue-500 hover:text-white mr-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteSongAdmin(${item.id})" class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded hover:bg-red-500 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                        `;
                    }
                    let videoBtn = item.video_url ? `<button onclick="openVideo('${item.video_url}')" class="text-gray-500 hover:text-purple-400 mr-2 z-20 relative"><i class="fa-solid fa-video"></i></button>` : '';

                    div.innerHTML = `
                        <div class="relative mb-3 aspect-square">
                            <img src="${item.image_url}" onerror="this.src='https://via.placeholder.com/150'" class="w-full h-full object-cover rounded shadow-lg pointer-events-none">
                            <div class="absolute bottom-2 right-2 w-10 h-10 bg-primary rounded-full text-white shadow-lg opacity-0 group-hover:opacity-100 transition hover:scale-110 flex items-center justify-center pointer-events-none"><i class="fa-solid fa-play ml-1"></i></div>
                        </div>
                        <h3 class="font-bold text-white text-sm truncate pointer-events-none">${item.title}</h3>
                        <p class="text-xs text-gray-400 truncate mt-1 pointer-events-none">${item.artist}</p>
                        <div class="flex justify-between items-center mt-2 relative z-10">
                            <div class="flex gap-2">
                                <button onclick="toggleLike(event, ${item.id})" class="${isLiked?'text-primary':'text-gray-500'} hover:text-white"><i class="fa-solid fa-heart"></i></button>
                                <button onclick="openPlaylistModal(${item.id})" class="text-gray-500 hover:text-white"><i class="fa-solid fa-plus"></i></button>
                                ${videoBtn}
                            </div>
                            <div class="flex gap-1">${adminActions}</div>
                        </div>
                    `;
                } else if (type === 'playlist') {
                    div.innerHTML = `
                        <div class="relative mb-3 aspect-square bg-gray-800 rounded flex items-center justify-center text-4xl text-gray-600 pointer-events-none"><i class="fa-solid fa-music"></i></div>
                        <h3 class="font-bold text-white text-sm truncate pointer-events-none">${item.name}</h3>
                        <p class="text-xs text-gray-400 mt-1 pointer-events-none">Playlist</p>
                        <button onclick="deletePlaylist(${item.id})" class="absolute top-2 right-2 text-red-500 opacity-0 group-hover:opacity-100 hover:scale-110 z-20 relative"><i class="fa-solid fa-trash"></i></button>
                    `;
                }
                container.appendChild(div);
            });
        }

        function renderHistoryList(data) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = "";
            if(!data || data.length === 0) return container.innerHTML = "<div class='text-center text-gray-500'>Chưa có lịch sử.</div>";

            data.forEach(item => {
                const timeStr = item.played_at ? new Date(item.played_at).toLocaleString('vi-VN') : "Vừa xong";
                const div = document.createElement('div');
                div.className = "flex items-center p-3 bg-white/5 rounded-lg hover:bg-white/10 cursor-pointer group border border-transparent hover:border-white/10";
                div.onclick = () => playSong(item.song_id, item.title, item.artist, item.stream_url, item.image_url, item.lyrics);

                div.innerHTML = `
                    <div class="w-12 h-12 rounded overflow-hidden mr-4"><img src="${item.image_url}" class="w-full h-full object-cover"></div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-white text-sm truncate">${item.title}</div>
                        <div class="text-xs text-gray-400 truncate">${item.artist}</div>
                    </div>
                    <div class="text-xs text-gray-500 mr-6 italic flex items-center gap-1">
                        <i class="fa-regular fa-clock"></i> ${timeStr}
                    </div>
                    <button class="text-primary opacity-0 group-hover:opacity-100 transition hover:scale-110">
                        <i class="fa-solid fa-play-circle text-2xl"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        // --- SEARCH & AI ---
        function handleEnter(e) { if(e.key === 'Enter') performSearch(); }
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            document.getElementById('mainContainer').classList.add('hidden');
            document.getElementById('searchSplitView').classList.remove('hidden');
            document.getElementById('pageName').innerText = `Tìm kiếm: "${query}"`;

            const sqlList = document.getElementById('sqlResults');
            const aiList = document.getElementById('aiResults');
            sqlList.innerHTML = '<div class="text-center py-10 text-gray-500">Đang tìm trong Database...</div>';
            aiList.innerHTML = '<div class="text-center py-10 text-primary">AI đang phân tích...</div>';

            fetch(`${API_URL}/songs?q=${encodeURIComponent(query)}`)
                .then(r => r.json())
                .then(json => {
                    sqlList.innerHTML = "";
                    if(json.data.length === 0) sqlList.innerHTML = '<div class="text-center text-gray-500 py-4">Không tìm thấy.</div>';
                    else json.data.forEach(s => renderRow(s, sqlList, false));
                }).catch(() => sqlList.innerHTML = 'Lỗi DB');

            setTimeout(() => {
                const aiData = performAILogic(query);
                aiList.innerHTML = "";
                document.getElementById('aiAnalysisMsg').innerText = `AI phân tích: "${aiData.mood}"`;
                aiData.localResults.forEach(s => { s.source = "Local DB"; renderRow(s, aiList, false); });
                aiData.webResults.forEach(s => { s.source = "Internet"; renderRow(s, aiList, true); });
                if(aiData.localResults.length === 0 && aiData.webResults.length === 0) aiList.innerHTML = "AI không tìm thấy gì.";
            }, 1000);
        }

        function performAILogic(keyword) {
            const k = keyword.toLowerCase();
            let mood = "Trung tính";
            let webResults = [];
            
            if(k.includes('buồn') || k.includes('mưa') || k.includes('khóc')) {
                mood = "Tâm trạng / Buồn";
                webResults = [{title:"Em Gái Mưa", artist:"Hương Tràm", image:"https://via.placeholder.com/50", video_url:""}, {title:"Tháng Tư Là Lời Nói Dối", artist:"Hà Anh Tuấn", image:"https://via.placeholder.com/50"}];
            } else if(k.includes('vui') || k.includes('quẩy') || k.includes('nhảy')) {
                mood = "Sôi động";
                webResults = [{title:"Waiting For You", artist:"MONO", image:"https://via.placeholder.com/50"}, {title:"See Tình", artist:"Hoàng Thùy Linh", image:"https://via.placeholder.com/50"}];
            } else {
                mood = "Tìm kiếm thông minh";
                webResults = [{title: `Bài hát về ${k}`, artist:"Nhiều ca sĩ", image:"https://via.placeholder.com/50"}];
            }

            const localResults = allSongsCache.filter(s => {
                const combined = (s.title + s.genre).toLowerCase();
                if (mood.includes("Buồn") && (combined.includes('mưa') || combined.includes('yêu') || s.genre==='Ballad')) return true;
                if (mood.includes("Sôi động") && (s.genre==='Pop' || s.genre==='Rock' || combined.includes('remix'))) return true;
                return false;
            }).slice(0, 3);

            return { mood, localResults, webResults };
        }

        function renderRow(song, container, isWebLink) {
            const div = document.createElement('div');
            div.className = "flex items-center gap-3 p-2 hover:bg-white/5 rounded cursor-pointer group border border-transparent hover:border-white/10";
            const img = isWebLink ? song.image : song.image_url;
            
            div.onclick = (e) => {
                if (e.target.closest('button')) return; 
                if (isWebLink) {
                    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(song.title)}`, '_blank');
                } else {
                    playSong(song.id, song.title, song.artist, song.stream_url, img, song.lyrics||'');
                }
            };

            let actionBtn = '';
            if(isWebLink) {
                actionBtn = `<button onclick="window.open('https://www.youtube.com/results?search_query=${song.title}', '_blank')" class="text-gray-400 hover:text-primary z-20 relative"><i class="fa-solid fa-up-right-from-square"></i></button>`;
            } else {
                let vidBtn = song.video_url ? `<button onclick="openVideo('${song.video_url}')" class="text-gray-500 hover:text-purple-400 mr-2 z-20 relative"><i class="fa-solid fa-video"></i></button>` : '';
                actionBtn = `${vidBtn} <button class="text-gray-400 hover:text-primary z-20 relative"><i class="fa-solid fa-play"></i></button>`;
            }

            div.innerHTML = `
                <img src="${img}" class="w-10 h-10 rounded object-cover pointer-events-none">
                <div class="flex-1 min-w-0 pointer-events-none">
                    <h4 class="text-sm font-bold text-white truncate">${song.title} ${song.source ? `<span class="text-[9px] bg-white/10 px-1 rounded text-gray-400">${song.source}</span>` : ''}</h4>
                    <p class="text-xs text-gray-400 truncate">${song.artist}</p>
                </div>
                <div>${actionBtn}</div>
            `;
            container.appendChild(div);
        }

        // --- ADMIN & STATS ---
        async function loadUsers() {
            const container = document.getElementById('mainContainer');
            const res = await fetch(`${API_URL}/admin/users`, {headers: { 'X-User-ID': currentUser.id, 'X-User-Role': 'admin' }});
            const json = await res.json();
            container.innerHTML = "";
            json.data.forEach(u => {
                const div = document.createElement('div');
                div.className = "bg-white/5 p-4 rounded border border-white/10 flex items-center justify-between";
                const isLocked = u.is_locked === 1;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-white"><i class="fa-solid fa-user"></i></div>
                        <div>
                            <div class="font-bold text-white text-sm">${u.username} <span class="text-xs ${isLocked?'text-red-500':'text-green-500'}">(${isLocked?'Locked':'Active'})</span></div>
                            <div class="text-xs text-gray-400 uppercase">${u.role}</div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        ${u.id !== currentUser.id ? `<button onclick="changeRole(${u.id}, '${u.role==='user'?'manager':'user'}')" class="text-blue-400 hover:text-white" title="Đổi quyền"><i class="fa-solid fa-user-gear"></i></button><button onclick="toggleLock(${u.id})" class="text-orange-400 hover:text-white"><i class="fa-solid ${isLocked?'fa-lock-open':'fa-lock'}"></i></button><button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-white"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function loadStats() {
            const container = document.getElementById('mainContainer');
            const headers = { 'X-User-ID': currentUser.id, 'X-User-Role': currentUser.role };
            const [r1, r2] = await Promise.all([fetch(`${API_URL}/admin/stats/general`, {headers}).then(r=>r.json()), fetch(`${API_URL}/admin/stats/top-listen`, {headers}).then(r=>r.json())]);
            
            container.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-indigo-600/20 border border-indigo-500/30 p-4 rounded-lg"><h4 class="text-indigo-400 text-xs uppercase">Bài Hát</h4><div class="text-3xl font-bold text-white">${r1.totalSongs||0}</div></div>
                    <div class="bg-green-600/20 border border-green-500/30 p-4 rounded-lg"><h4 class="text-green-400 text-xs uppercase">Users</h4><div class="text-3xl font-bold text-white">${r1.totalUsers||0}</div></div>
                    <div class="bg-yellow-600/20 border border-yellow-500/30 p-4 rounded-lg"><h4 class="text-yellow-400 text-xs uppercase">Lượt Nghe</h4><div class="text-3xl font-bold text-white">${r1.totalListens||0}</div></div>
                    <div class="bg-red-600/20 border border-red-500/30 p-4 rounded-lg"><h4 class="text-red-400 text-xs uppercase">Bị Khóa</h4><div class="text-3xl font-bold text-white">${r1.lockedUsers||0}</div></div>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-lg p-6">
                    <h3 class="text-lg font-bold text-white mb-4 border-b border-white/10 pb-2">Top Nghe Nhiều</h3>
                    <div class="space-y-3">${r2.data.map((s,i) => `<div class="flex justify-between items-center text-sm"><div class="flex items-center gap-3"><span class="text-primary font-bold w-6">#${i+1}</span> <span class="text-white">${s.title}</span></div><span class="text-gray-400">${s.listen_count} lượt</span></div>`).join('')}</div>
                </div>
            `;
        }

        // --- UTILS ---
        async function changeRole(id, role) { await fetch(`${API_URL}/admin/users/role/${id}`, {method:'PUT', headers:{'Content-Type':'application/json','X-User-ID':currentUser.id,'X-User-Role':'admin'}, body:JSON.stringify({role})}); loadUsers(); }
        async function toggleLock(id) { await fetch(`${API_URL}/admin/users/lock/${id}`, {method:'PUT', headers:{'X-User-ID':currentUser.id,'X-User-Role':'admin'}}); loadUsers(); }
        async function deleteUser(id) { if(confirm("Xóa?")) await fetch(`${API_URL}/admin/users/${id}`, {method:'DELETE', headers:{'X-User-ID':currentUser.id,'X-User-Role':'admin'}}); loadUsers(); }
        async function createPlaylist() { const name = prompt("Tên Playlist:"); if(name) { await fetch(`${API_URL}/user/playlists/create`, {method:'POST', headers:{'Content-Type':'application/json','X-User-ID':currentUser.id}, body:JSON.stringify({name})}); loadPlaylists(); } }
        async function viewPlaylist(id, name) { const res = await fetch(`${API_URL}/user/playlists/${id}`, {headers:{'X-User-ID':currentUser.id}}); const json = await res.json(); document.getElementById('pageName').innerText = `Playlist: ${name}`; renderGrid(json.data, 'song'); }
        async function deletePlaylist(id) { if(confirm("Xóa playlist?")) { await fetch(`${API_URL}/user/playlists/delete/${id}`, {method:'DELETE', headers:{'X-User-ID':currentUser.id}}); loadPlaylists(); } }
        async function openPlaylistModal(songId) { selectedSongId = songId; document.getElementById('playlistModal').classList.remove('hidden'); const list = document.getElementById('modalPlaylistList'); const res = await fetch(`${API_URL}/user/playlists`, {headers:{'X-User-ID':currentUser.id}}); const json = await res.json(); list.innerHTML = ""; json.data.forEach(p => { const div = document.createElement('div'); div.className = "p-2 hover:bg-white/10 cursor-pointer text-white text-sm"; div.innerText = p.name; div.onclick = async () => { await fetch(`${API_URL}/user/playlists/add-song`, {method:'POST', headers:{'Content-Type':'application/json','X-User-ID':currentUser.id}, body:JSON.stringify({playlist_id:p.id, song_id:selectedSongId})}); alert("Đã thêm!"); document.getElementById('playlistModal').classList.add('hidden'); }; list.appendChild(div); }); }
        
        // ADMIN ACTIONS
        async function deleteSongAdmin(id) { 
            event.stopPropagation();
            if(confirm("Xóa bài hát?")) { 
                await fetch(`${API_URL}/admin/songs/${id}`, {method:'DELETE', headers:{'X-User-ID':currentUser.id, 'X-User-Role':currentUser.role}}); 
                loadSongs(); 
            } 
        }
        async function toggleLike(e, id) { 
            e.stopPropagation(); 
            await fetch(`${API_URL}/user/likes/toggle`, {method:'POST', headers:{'Content-Type':'application/json','X-User-ID':currentUser.id}, body:JSON.stringify({song_id:id})}); 
            // Refresh đúng tab đang đứng
            if(document.getElementById('pageName').innerText === "Yêu Thích") loadLikedSongs(); else loadSongs();
        }
        function toggleAdminModal() { document.getElementById('adminModal').classList.toggle('hidden'); }
        
        async function addSong() { 
            const formData = new FormData(); 
            formData.append('title', document.getElementById('newTitle').value); 
            formData.append('artist', document.getElementById('newArtist').value); 
            formData.append('genre', document.getElementById('newGenre').value); 
            formData.append('year', document.getElementById('newYear').value);
            formData.append('lyrics', document.getElementById('newLyrics').value);
            formData.append('musicFile', document.getElementById('newFile').files[0]); 
            formData.append('imageFile', document.getElementById('newImage').files[0]); 
            formData.append('videoFile', document.getElementById('newVideo').files[0]);
            try { 
                const res = await fetch(`${API_URL}/admin/songs/add`, {method:'POST', headers:{'X-User-ID':currentUser.id, 'X-User-Role':currentUser.role}, body:formData}); 
                if(res.ok) { alert("Thành công!"); toggleAdminModal(); loadSongs(); }
            } catch(e) { alert("Lỗi"); } 
        }

        function openEditSong(e, song) {
            e.stopPropagation();
            document.getElementById('editId').value = song.id;
            document.getElementById('editTitle').value = song.title;
            document.getElementById('editArtist').value = song.artist;
            document.getElementById('editGenre').value = song.genre;
            document.getElementById('editYear').value = song.year;
            document.getElementById('editLyrics').value = song.lyrics;
            document.getElementById('editSongModal').classList.remove('hidden');
        }

        async function submitEditSong() {
            const id = document.getElementById('editId').value;
            const body = {
                title: document.getElementById('editTitle').value,
                artist: document.getElementById('editArtist').value,
                genre: document.getElementById('editGenre').value,
                year: document.getElementById('editYear').value,
                lyrics: document.getElementById('editLyrics').value
            };
            await fetch(`${API_URL}/admin/songs/update/${id}`, {method:'PUT', headers:{'Content-Type':'application/json','X-User-ID':currentUser.id,'X-User-Role':currentUser.role}, body:JSON.stringify(body)});
            alert("Đã sửa!"); document.getElementById('editSongModal').classList.add('hidden'); loadSongs();
        }

        // PLAYER CONTROLS
        function playSong(id, title, artist, url, img, lyrics) {
            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentArtist').innerText = artist;
            document.getElementById('currentCover').src = img;
            document.getElementById('lyricsContent').innerText = lyrics || "Chưa có lời.";
            
            const playedAt = new Date().toISOString(); // Lấy thời gian hiện tại
            
            audio.src = url; 
            audio.play(); 
            togglePlay(); // update icon
            
            // Gửi thời gian lên server
            if(currentUser) fetch(`${API_URL}/user/history/add`, {
                method:'POST', 
                headers:{'Content-Type':'application/json','X-User-ID':currentUser.id}, 
                body:JSON.stringify({song_id:id, played_at: playedAt})
            });
        }

        function togglePlay() { 
            if(audio.paused) {
                audio.play(); 
                document.getElementById('playIcon').className = 'fa-solid fa-pause ml-0';
            } else {
                audio.pause(); 
                document.getElementById('playIcon').className = 'fa-solid fa-play ml-1';
            }
        }
        
        audio.onloadedmetadata = () => {
            document.getElementById('duration').innerText = formatTime(audio.duration);
            document.getElementById('currentTime').innerText = "00:00";
            progressBar.value = 0;
        };
        audio.ontimeupdate = () => {
            if(audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            }
        };
        progressBar.oninput = (e) => { audio.currentTime = (audio.duration / 100) * e.target.value; };
        function formatTime(s) {
            if(isNaN(s)) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec<10?'0':''}${sec}`;
        }
        
        // VIDEO
        function openVideo(url) { 
            event.stopPropagation();
            document.getElementById('videoModal').classList.remove('hidden'); 
            const v = document.getElementById('videoPlayer'); v.src = url; v.play(); audio.pause(); 
        }
        function closeVideo() { 
            document.getElementById('videoModal').classList.add('hidden'); 
            document.getElementById('videoPlayer').pause(); 
        }

        loadSongs();
    </script>
